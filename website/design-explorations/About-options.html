<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POPPy — About page · 3 flow options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #14140f; }
    body { font-family: system-ui, sans-serif; color: #1a1f1a; }
    * { box-sizing: border-box; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="about-variants.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const App = () => (
      <DesignCanvas
        title="About page — three flow options"
        subtitle="Each artboard is a full About page in a different flow pattern. Click an artboard to expand it to full screen, then scroll. Tell me which one you want me to commit."
      >
        <DCSection
          id="about-options"
          title="Three flows"
          subtitle="A: Narrative chapters · B: Editorial / pull-quote · C: Anchored chapter nav"
        >
          <DCArtboard id="about-a" label="A · Narrative chapters" width={1280} height={2200}>
            <AboutA />
          </DCArtboard>
          <DCArtboard id="about-b" label="B · Editorial" width={1280} height={2400}>
            <AboutB />
          </DCArtboard>
          <DCArtboard id="about-c" label="C · Anchored chapters" width={1280} height={3000}>
            <AboutC />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
